      <g id="icon-chart"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></g>

  </svg>

  <div id="app" class="app-wrapper">
    <!-- Top Navigation Header -->
    <header class="app-header">
      <div class="header-left">
        <button id="nav-home-btn" class="header-btn" title="Home Screen" aria-label="Home">
          <svg class="svg-icon"><use href="#icon-home"/></svg>
        </button>
        <div class="header-title-wrap">
          <span id="header-stream-tag" class="header-tag">English 102</span>
          <span id="header-unit-tag" class="header-tag unit-tag">Select Stream</span>
        </div>
      </div>

      <div class="header-actions">
        <button id="nav-mistakes-btn" class="header-btn mistakes-nav-btn" title="Mistake Bank (Previously Missed Questions)" aria-label="Mistake Bank">
          <svg class="svg-icon"><use href="#icon-bookmark"/></svg>
          <span id="mistakes-count-badge" class="badge-counter hidden">0</span>
        </button>
        <button id="nav-stats-btn" class="header-btn" title="Completion & Study Statistics" aria-label="Statistics">
          <svg class="svg-icon"><use href="#icon-chart"/></svg>
        </button>
        <button id="toggle-mode-btn" class="header-btn mode-btn" title="Toggle Learning Hub / Quiz Mode" aria-label="Switch Mode">
          <span id="mode-icon"><svg class="svg-icon"><use href="#icon-academic"/></svg></span>
          <span id="mode-label">Learning Hub</span>
        </button>
        <button id="toggle-trans-btn" class="header-btn pill-btn" title="Toggle Arabic Translation" aria-label="Toggle Arabic">
          <span class="btn-text-en">EN</span>
          <span class="btn-divider">/</span>
          <span class="btn-text-ar">عربي</span>
        </button>
        <button id="audio-settings-btn" class="header-btn" title="Speech Voice Settings" aria-label="Voice Settings">
          <svg class="svg-icon"><use href="#icon-settings"/></svg>
        </button>
        <button id="toggle-theme-btn" class="header-btn" title="Toggle Dark/Light Mode" aria-label="Toggle Theme">
          <svg class="svg-icon theme-sun"><use href="#icon-sun"/></svg>
          <svg class="svg-icon theme-moon"><use href="#icon-moon"/></svg>
        </button>
      </div>
    </header>

    <!-- Main Dynamic Viewport Container -->
    <main id="view-container" class="main-content" role="main">
      <!-- Injected dynamically by Router -->
    </main>

    <!-- Voice Settings Modal -->
    <div id="voice-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="voice-modal-title">
      <div class="modal-card">
        <div class="modal-header">
          <h3 id="voice-modal-title">Speech Synthesis Audio Settings</h3>
          <button id="close-modal-btn" class="icon-btn-plain" aria-label="Close modal"><svg class="svg-icon"><use href="#icon-close"/></svg></button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="voice-select">English Speaker Voice:</label>
            <select id="voice-select" class="custom-select"></select>
          </div>
          <div class="form-group">
            <label for="speech-rate">Speaking Speed (<span id="rate-value">0.9x</span>):</label>
            <input type="range" id="speech-rate" min="0.5" max="1.3" step="0.05" value="0.9">
          </div>
          <button id="test-voice-btn" class="btn btn-secondary">Test Voice Pronunciation</button>
        </div>
      </div>
    </div>

    <!-- In-App Confirmation / Action Modal Dialog -->
    <div id="confirm-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title">
      <div class="modal-card confirm-modal-card">
        <div class="confirm-modal-header">
          <div class="confirm-modal-icon">
            <svg class="svg-icon" style="width:24px;height:24px;"><use href="#icon-rotate"/></svg>
          </div>
          <h3 id="confirm-modal-title">Quit Quiz?</h3>
        </div>
        <div class="confirm-modal-body">
          <p id="confirm-modal-message">Are you sure you want to quit the current quiz and return to Home? Your progress will not be saved.</p>
        </div>
        <div class="confirm-modal-footer">
          <button id="confirm-modal-cancel" class="btn btn-outline">Cancel</button>
          <button id="confirm-modal-ok" class="btn btn-primary">Quit to Home</button>
        </div>
      </div>
    </div>

    <!-- Word Translation Popover Tooltip -->
    <div id="word-popover" class="word-tooltip hidden" role="tooltip">
      <div class="tooltip-body">
        <span id="popover-en" class="tooltip-en"></span>
        <span id="popover-ar" class="tooltip-ar"></span>
      </div>
    </div>
  </div>

  <!-- Lexicon Dictionary -->
  <script src="src/data/lexicon/dictionary.js"></script>
