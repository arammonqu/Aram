        function checkAnswer() {

            let userAnswerRaw = null;

            let correctAnswerDisplay = "";
            let correctAnswerDisplayAr = "";

            if (q.type === 'mc') {
                if (currentSelectedValue === null) {
                    document.getElementById('submit-btn').classList.add('animate-pulse');
                    setTimeout(() => document.getElementById('submit-btn').classList.remove('animate-pulse'), 500);
                    return;
                }
                userAnswerRaw = currentSelectedValue;
                isCorrect = (userAnswerRaw === q.correctAnswer);
                userAnswerDisplay = q.options[userAnswerRaw];
                userAnswerDisplayAr = q.optionsAr[userAnswerRaw];
                correctAnswerDisplay = q.options[q.correctAnswer];
                correctAnswerDisplayAr = q.optionsAr[q.correctAnswer];

                if (!isCorrect) {

                    incorrectLabelEn.classList.remove('border-blue-500', 'bg-blue-50/50', 'ring-blue-100');

                    // Style Arabic Incorrect
                    const incorrectLabelAr = document.getElementById(`label-ar-${userAnswerRaw}`);
                    incorrectLabelAr.classList.remove('border-blue-500', 'bg-blue-50/50', 'ring-blue-100');
                    incorrectLabelAr.classList.add('bg-red-50', 'border-red-400', 'opacity-70');

                }
                
                // Disable hidden radios visually
                document.querySelectorAll('.hidden-radio').forEach(el => el.disabled = true);

            } else if (q.type === 'calc') {
                const inputElEn = document.getElementById('calc-answer-en');
                const inputElAr = document.getElementById('calc-answer-ar');
                userAnswerRaw = parseFloat(inputElEn.value);
                if (isNaN(userAnswerRaw)) {
                    inputElEn.classList.add('border-red-400', 'ring-4', 'ring-red-100', 'bg-red-50');
                    inputElAr.classList.add('border-red-400', 'ring-4', 'ring-red-100', 'bg-red-50');

                        inputElAr.classList.remove('border-red-400', 'ring-4', 'ring-red-100', 'bg-red-50');

                    return;
                }
                
                isCorrect = Math.abs(userAnswerRaw - q.correctAnswer) <= q.tolerance;
                userAnswerDisplay = userAnswerRaw.toString();
                userAnswerDisplayAr = userAnswerDisplay;
                correctAnswerDisplay = q.correctAnswer.toString();
                correctAnswerDisplayAr = correctAnswerDisplay;

                inputElEn.disabled = true;
                inputElAr.disabled = true;

            answered = true;
            if (isCorrect) score++;

                questionText: q.question,

            if (isCorrect) {

                fbAr.className = 'mt-8 rounded-xl p-6 shadow-sm border slide-up bg-white border-green-300 shadow-[0_0_15px_rgba(34,197,94,0.1)]';
                
                fbEn.innerHTML = `
                    <div class="flex items-center mb-4 pb-4 border-b border-green-100">

                fbAr.className = 'mt-8 rounded-xl p-6 shadow-sm border slide-up bg-white border-red-300 shadow-[0_0_15px_rgba(239,68,68,0.1)]';

                        <p class="font-medium text-base">${msgAr}</p>
                    </div>
                    <button onclick="showReview()" class="w-full mb-4 bg-white border-2 border-slate-300 hover:bg-slate-50 text-slate-800 font-bold py-4 px-6 rounded-xl shadow-sm transition-all focus:ring-4 focus:ring-slate-200">
                        <i class="fas fa-list-check ml-2 text-blue-600"></i> دليل الدراسة
                    </button>
                    <button onclick="initQuiz()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-xl shadow-md transition-all">
                        <i class="fas fa-home ml-2"></i> قائمة المواضيع
                    </button>
                </div>
            `;

            quizContainer.innerHTML = `
                <div class="py-8 fade-in">
                    ${createDualPanel(enHTML, arHTML)}
                </div>
            `;

            setTimeout(() => {
                const ring = document.getElementById('score-ring');
                if(ring) ring.style.strokeDashoffset = offset;
            }, 100);
            
            const scrollWrapper = document.getElementById('scroll-wrapper');
            if (scrollWrapper) scrollWrapper.scrollTop = 0;
        }

        function showReview() {
            document.getElementById('header-stats-en').classList.add('hidden');
            document.getElementById('header-stats-ar').classList.add('hidden');
            document.getElementById('scroll-wrapper').classList.add('review-mode'); 
            
            const headerEn = `
                <div class="mb-8 border-b border-slate-200 pb-5">
                    <h2 class="text-2xl font-extrabold text-slate-800"><i class="fas fa-book-reader mr-3 text-blue-600"></i>Detailed Study Guide</h2>
                    <p class="text-sm text-slate-500 font-medium mt-1">Review your answers and learn from the core concepts.</p>
                </div>
            `;
            const headerAr = `
                <div class="mb-8 border-b border-slate-200 pb-5" dir="rtl">
                    <h2 class="text-2xl font-extrabold text-slate-800"><i class="fas fa-book-reader ml-3 text-blue-600"></i>دليل الدراسة التفصيلي</h2>
                    <p class="text-sm text-slate-500 font-medium mt-1">راجع إجاباتك وتعلم من المفاهيم الأساسية.</p>
                </div>
            `;

            let reviewContentEn = '<div class="space-y-8">';
            let reviewContentAr = '<div class="space-y-8" dir="rtl">';

            userAnswersData.forEach((data, index) => {
                const isCorrect = data.isCorrect;
                
                // English Card
                let cardEn = '';
                if (isCorrect) {
                    cardEn = `
                        <div class="bg-green-50/50 border border-green-200 rounded-lg p-3 mt-3 flex items-start gap-3">
                            <div class="text-green-500 mt-0.5"><i class="fas fa-check-circle"></i></div>
                            <div>
                                <div class="text-[10px] uppercase font-bold text-green-600 tracking-wider mb-0.5">Your Correct Answer</div>
                                <div class="text-sm font-semibold text-green-900">${data.userAnswerDisplay}</div>
                            </div>
                        </div>`;
                } else {
                    cardEn = `
                        <div class="bg-red-50/50 border border-red-200 rounded-lg p-3 mt-3">
                            <div class="flex items-start gap-3 mb-2 pb-2 border-b border-red-100">
                                <div class="text-red-500 mt-0.5"><i class="fas fa-times-circle"></i></div>
                                <div><div class="text-[10px] uppercase font-bold text-red-600 tracking-wider mb-0.5">Your Answer</div><div class="text-sm font-semibold text-red-900 line-through opacity-70">${data.userAnswerDisplay}</div></div>
                            </div>
                            <div class="flex items-start gap-3">
                                <div class="text-green-500 mt-0.5"><i class="fas fa-check-circle"></i></div>
                                <div><div class="text-[10px] uppercase font-bold text-green-600 tracking-wider mb-0.5">Correct Answer</div><div class="text-sm font-bold text-green-800">${data.correctAnswerDisplay}</div></div>
                            </div>
                        </div>`;
                }
                reviewContentEn += `
                    <div class="border rounded-xl shadow-sm bg-white overflow-hidden ${isCorrect ? 'border-slate-200' : 'border-red-300 ring-1 ring-red-100'} relative">
                        <div class="absolute top-0 left-0 w-1.5 h-full ${isCorrect ? 'bg-green-400' : 'bg-red-500'}"></div>
                        <div class="p-5 pl-7">
                            <div class="flex justify-between items-start mb-2"><span class="text-[11px] font-bold uppercase tracking-widest text-slate-400">Question ${index + 1} &bull; ${data.category}</span></div>
                            <h4 class="font-bold text-slate-900 text-lg leading-snug">${data.questionText}</h4>
                            ${activeQuestions[index].table ? `<div class="mt-3 mb-2 overflow-x-auto opacity-90">${activeQuestions[index].table}</div>` : ''}
                            ${cardEn}
                            <div class="mt-6 pt-5 border-t border-slate-100">
                                <div class="text-[10px] uppercase font-bold text-slate-400 tracking-widest mb-3 flex items-center"><i class="fas fa-graduation-cap mr-2"></i> Learning Breakdown</div>
                                ${renderExplanationHTML(data.explanation, false)}
                            </div>
                        </div>
                    </div>`;

                // Arabic Card
                let cardAr = '';
                if (isCorrect) {
                    cardAr = `
                        <div class="bg-green-50/50 border border-green-200 rounded-lg p-3 mt-3 flex items-start gap-3">
                            <div class="text-green-500 mt-0.5"><i class="fas fa-check-circle"></i></div>
                            <div>
                                <div class="text-[10px] uppercase font-bold text-green-600 tracking-wider mb-0.5">إجابتك الصحيحة</div>
                                <div class="text-sm font-semibold text-green-900">${data.userAnswerDisplayAr}</div>
                            </div>
                        </div>`;
                } else {
                    cardAr = `
                        <div class="bg-red-50/50 border border-red-200 rounded-lg p-3 mt-3">
                            <div class="flex items-start gap-3 mb-2 pb-2 border-b border-red-100">
                                <div class="text-red-500 mt-0.5"><i class="fas fa-times-circle"></i></div>
                                <div><div class="text-[10px] uppercase font-bold text-red-600 tracking-wider mb-0.5">إجابتك</div><div class="text-sm font-semibold text-red-900 line-through opacity-70">${data.userAnswerDisplayAr}</div></div>
                            </div>
                            <div class="flex items-start gap-3">
                                <div class="text-green-500 mt-0.5"><i class="fas fa-check-circle"></i></div>
                                <div><div class="text-[10px] uppercase font-bold text-green-600 tracking-wider mb-0.5">الإجابة الصحيحة</div><div class="text-sm font-bold text-green-800">${data.correctAnswerDisplayAr}</div></div>
                            </div>
                        </div>`;
                }
                reviewContentAr += `
                    <div class="border rounded-xl shadow-sm bg-white overflow-hidden ${isCorrect ? 'border-slate-200' : 'border-red-300 ring-1 ring-red-100'} relative">
                        <div class="absolute top-0 right-0 w-1.5 h-full ${isCorrect ? 'bg-green-400' : 'bg-red-500'}"></div>
                        <div class="p-5 pr-7">
                            <div class="flex justify-between items-start mb-2"><span class="text-[11px] font-bold uppercase tracking-widest text-slate-400">السؤال ${index + 1} &bull; ${data.categoryAr}</span></div>
                            <h4 class="font-bold text-slate-900 text-lg leading-snug">${data.questionTextAr}</h4>
                            ${activeQuestions[index].tableAr ? `<div class="mt-3 mb-2 overflow-x-auto opacity-90">${activeQuestions[index].tableAr}</div>` : (activeQuestions[index].table ? `<div class="mt-3 mb-2 overflow-x-auto opacity-90">${activeQuestions[index].table}</div>` : '')}
                            ${cardAr}
                            <div class="mt-6 pt-5 border-t border-slate-100">
                                <div class="text-[10px] uppercase font-bold text-slate-400 tracking-widest mb-3 flex items-center"><i class="fas fa-graduation-cap ml-2"></i> تحليل التعلم</div>
                                ${renderExplanationHTML(data.explanationAr, true)}
                            </div>
                        </div>
                    </div>`;
            });

            reviewContentEn += '</div>';
            reviewContentAr += '</div>';

            const footerEn = `
                <div class="mt-12 mb-4 text-center">
                    <button onclick="initQuiz()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-10 rounded-xl shadow-md transition-all outline-none">
                        <i class="fas fa-home mr-2"></i> Back to Menu
                    </button>
                </div>`;
            const footerAr = `
                <div class="mt-12 mb-4 text-center">
                    <button onclick="initQuiz()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-10 rounded-xl shadow-md transition-all outline-none">
                        <i class="fas fa-home ml-2"></i> العودة للقائمة
                    </button>
                </div>`;

            quizContainer.innerHTML = `
                <div class="fade-in sticky top-0 bg-slate-50 z-20 shadow-sm border-b border-slate-200 mb-6">
                    ${createDualPanel(
                        `<button onclick="showResults()" class="my-4 text-slate-600 hover:text-slate-900 font-bold py-2.5 px-5 rounded-lg bg-white border border-slate-200 shadow-sm"><i class="fas fa-arrow-left mr-2"></i> Back to Score</button>`,
                        `<button onclick="showResults()" class="my-4 text-slate-600 hover:text-slate-900 font-bold py-2.5 px-5 rounded-lg bg-white border border-slate-200 shadow-sm">العودة إلى النتيجة <i class="fas fa-arrow-right ml-2"></i></button>`
                    )}
                </div>
                <div class="fade-in">
                    ${createDualPanel(headerEn + reviewContentEn + footerEn, headerAr + reviewContentAr + footerAr)}
                </div>
            `;
            document.getElementById('scroll-wrapper').scrollTop = 0;
        }

        // Initialize App
        initQuiz();
    </script>
</body>
</html>
